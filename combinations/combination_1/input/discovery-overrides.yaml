# Every publisher's storage is <base_url><publisher>/, and the query services are on the same host,
# on their own ports. The host is the proxy's container: engines on the experiment's network reach it.
base_url: "http://fedshop-proxy:3000/"

# Ratio of known federation members compared to discovered
known:
  ratio: 0.5
  seed: 42
watdiv:                        
  seed: 42                    
  today: "2026-11-16"        

# how publishers group their entities into documents (every IRI resolves to its document)
layout:                        
  shops:
    # Proportion with a page per product, holding its offers: <shop>/Product42#Offer7
    product_pages: 1.0        
  review_sites:               
    # Proportion with a page per product, holding its reviews: <site>/Product42#Review9
    product_pages: 0.5         
    # Proportion with a document per review date: <site>/reviews/2007-03-05#Review9
    by_day: 0.5               
  # a document per publish month (<brand>/products/2005-06#Product77)
  brands: by-month      
  # every document links to its storage root: <doc> void:inDataset <publisher/>
  dataset_links: true          
  seed: 42
members:                    
  shops: 20
  review_sites: 20
  # Number of different products sold by shops
  pool: 10000                  
  # Average offers per shop
  offers: 1000  
  # average reviews per review site               
  reviews: 5000               
  reviews_per_reviewer: 100
  seed: 42
# Producers who publish their products, which are always in the discovery part of benchmark
brands:                 
  # over all brands (at least members.pool): 27 to 3,295 per brand       
  products: 30000
  # Number of brands             
  count: 400
  zipf: 0.6
  min_products: 20
  # The share of largest brands that run a query service
  service_share: 0.25          
  # product types available in 1 market, 2, or all
  type_spread: {1: 0.6, 2: 0.3, all: 0.1}   
  seed: 42
links:                      
  reviews: 0
  where_to_buy: 0
  also_reviewed: 0
  brand_where_to_buy: 0
  brand_reviews: 0
  # <listing> fs:listingOf <product> for every listing, in the brand's product document
  brand_listings: true        
  seed: 42
# Markets which naturally cluster the connections between IRIs
markets:                       
  count: 5
  # Markets are based on the generated countries of shops and producers
  countries: [[US], [UK, FR, ES], [DE, AT, RU], [JP, KR], [CN]]
  # brands sold in every market when above zero traversal can become unbounded
  global_brands: 0             
  global_share: 0.0
  seed: 42
proxy:
  # the Solid server and the services listen on their public port + this
  port_offset: 10000           
  # CPU and memory sampling interval for min/max (totals are exact)
  sample_ms: 50                
workload:
  per_template: 5
  max_candidates: 40
  max_rows: 100000
  seed: 42
